name: CI

on:
  push:
    branches: [ main, "phase-**" ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: ${{ matrix.os }} - ${{ matrix.build_type }} (${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
            build_type: Debug
            sanitizer: "address,undefined"
          - os: ubuntu-latest
            compiler: clang
            build_type: Release
            sanitizer: ""
          - os: windows-latest
            compiler: msvc
            build_type: Debug
            sanitizer: ""
          - os: windows-latest
            compiler: msvc
            build_type: Release
            sanitizer: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Ninja
        uses: asepticvoid/setup-ninja@v1.0.0

      - name: Set up Clang (if selected)
        if: matrix.compiler == 'clang'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        env:
          CC: ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }}
          CXX: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DENABLE_SANITIZERS=${{ matrix.sanitizer != '' && 'ON' || 'OFF' }} \
            -DSANITIZER_TYPE="${{ matrix.sanitizer }}" \
            -DBUILD_TESTING=ON

      - name: Configure CMake (Windows MSVC)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure CMake Windows
        if: runner.os == 'Windows'
        run: |
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} `
            -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.build_type }}

      - name: Run Tests (CTest)
        run: ctest --test-dir build --output-on-failure -C ${{ matrix.build_type }}
